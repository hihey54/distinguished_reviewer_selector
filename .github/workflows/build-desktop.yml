name: Build native PC Recognition Selector

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing release tag to upload assets to (e.g., v1.0.0)'
        required: false
        default: ''
        type: string
  push:
    paths:
      - 'desktop_app/**'
      - 'FAQ.md'
      - 'code/**'
      - '.github/workflows/build-desktop.yml'
      - '.github/scripts/package_release.py'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: ubuntu-22.04
            platform: linux
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
        if: matrix.platform == 'windows' || matrix.platform == 'linux' || matrix.platform == 'macos-intel'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
        if: matrix.platform == 'macos-arm64'
      - name: Install Linux Tk dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk libtk8.6 libtcl8.6
      - name: Check Tk + run deterministic engine tests
        run: |
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"
          python -m unittest discover -s desktop_app/tests -v
      - name: Install packaging tool
        run: python -m pip install "pyinstaller>=6.11,<7"
      - name: Create standalone desktop executable
        run: python -m PyInstaller --clean --noconfirm --onedir --windowed --name PCRecognitionSelector --paths code --paths . desktop_app/launch.py
      - name: Package native build
        run: python .github/scripts/package_release.py ${{ matrix.platform }}
      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: PCRecognitionSelector-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  # Attach on a newly published release, or manually to an existing release
  # when a tag is supplied in the workflow_dispatch form. Ordinary commits
  # only produce workflow artifacts and do not overwrite release assets.
  attach-release:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PCRecognitionSelector-*
          path: release
          merge-multiple: true
      - name: Attach platform builds to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          # This job downloads build artifacts but has no Git checkout.
          # --repo avoids relying on a local .git directory.
          gh release upload "$TAG" release/* --clobber --repo "$GH_REPO"
